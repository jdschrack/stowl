version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: ".github/"
    schedule:
      interval: "weekly"
    groups:
      gha-updates:
        patterns:
          - "*"
